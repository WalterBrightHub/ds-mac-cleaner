name: ds-mac-cleaner

services:
  db:
    image: postgres:16-alpine
    container_name: ds-mac-cleaner-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DSMC_DB_NAME:-dsmac}
      POSTGRES_USER: ${DSMC_DB_USER:-dsmac}
      POSTGRES_PASSWORD: ${DSMC_DB_PASSWORD:-dsmac_local_dev}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${DSMC_DB_PORT:-55432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DSMC_DB_USER:-dsmac} -d ${DSMC_DB_NAME:-dsmac}"]
      interval: 3s
      timeout: 3s
      retries: 20
    labels:
      com.dsmaccleaner.service: "history-db"

  adminer:
    image: adminer:4
    container_name: ds-mac-cleaner-adminer
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DSMC_ADMINER_PORT:-8088}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark
    labels:
      com.dsmaccleaner.service: "db-ui"

volumes:
  db_data:
    name: ds-mac-cleaner-db-data
